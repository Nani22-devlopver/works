<html>
    <head>student registration form</head>

    <body>
        
<h1>personal information</h1>
<label for="name" >fullname:</label>
<input type="text" id="name" placeholder="enter your name"><br><br>
<label for="age" >age:</label>
<input type="number" id="age" placeholder > <br><br>
<label for="gender" >gender:</label>
<label for="male"> male:</label>
<input type="radio" id="male" name="gender" value="male">
<label for="female" >female:</label>
<input type="radio" id="female" name="gender" value="female"><br><br>
<label for="dob">date of birth:</label>
<input type="date" id="dob" placeholder="enter your dob"> <br><br>
<label for="email" >email:</label>
<input type="email" id="email"><br><br>
<label for="country">country</label>
<select id="country">
<option value="usa">usa</option>
<option value="uk">uk</option>
<option value="india">india</option>
<option value="australia">australia</option>
</select> <br><br>
<label for="mobilenumber">mobilenumber</label>
<input type="tel" id="mobile"><br><br>
<label for="message">message</label>
<textarea id="message" rows="5" cols="20"></textarea> <br><br>
<label for="map">upload resume</label>
<input type="file" id="map"> <br><br>
<button type="submit">submit</button>
<button type="reset" >reset</button>


    </body>
</html>
