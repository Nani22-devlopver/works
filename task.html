
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eef2ff);
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 25px;
        }

        .form-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .add-btn {
            background: #2563eb;
        }

        .update-btn {
            background: #16a34a;
            display: none;
        }

        .cancel-btn {
            background: #6b7280;
            display: none;
        }

        button:hover {
            opacity: 0.85;
        }

        .button-group {
            display: flex;
            gap: 10px;
            grid-column: span 2;
        }

        .search-box {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 13px;
            border: 2px solid #2563eb;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .edit-btn {
            background: #f59e0b;
            padding: 7px 12px;
        }

        .delete-btn {
            background: #dc2626;
            padding: 7px 12px;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .form-box {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-column: span 1;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Management System</h1>

    <!-- Student Form -->
    <div class="form-box">

        <input type="text" id="name" placeholder="Student Name">

        <input type="text" id="roll" placeholder="Roll Number">

        <input type="number" id="age" placeholder="Age">

        <select id="gender">
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <input type="text" id="course" placeholder="Course">

        <input type="tel" id="phone" placeholder="Phone Number">

        <div class="button-group">

            <button class="add-btn" id="addBtn" onclick="addStudent()">
                ➕ Add Student
            </button>

            <button class="update-btn" id="updateBtn" onclick="updateStudent()">
                🔄 Update
            </button>

            <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()">
                ❌ Cancel
            </button>

        </div>

    </div>


    <!-- Search -->
    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search student by name, roll number or course..."
            onkeyup="searchStudent()"
        >

    </div>


    <!-- Student Table -->
    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Course</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

</div>


<script>

    let students = JSON.parse(localStorage.getItem("students")) || [];

    let editIndex = -1;


    // Display Students
    function displayStudents(data = students) {

        let table = document.getElementById("studentTable");

        table.innerHTML = "";

        if (data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="no-data">
                        No student data found
                    </td>
                </tr>
            `;

            return;
        }

        data.forEach((student, index) => {

            let originalIndex = students.indexOf(student);

            table.innerHTML += `

                <tr>

                    <td>${index + 1}</td>

                    <td>${student.name}</td>

                    <td>${student.roll}</td>

                    <td>${student.age}</td>

                    <td>${student.gender}</td>

                    <td>${student.course}</td>

                    <td>${student.phone}</td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editStudent(${originalIndex})">
                            ✏️ Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${originalIndex})">
                            🗑️ Delete
                        </button>

                    </td>

                </tr>

            `;
        });
    }


    // Add Student
    function addStudent() {

        let student = getFormData();

        if (!student) return;

        students.push(student);

        saveData();

        clearForm();

        displayStudents();

        alert("Student added successfully! ✅");
    }


    // Get Form Data
    function getFormData() {

        let name = document.getElementById("name").value.trim();
        let roll = document.getElementById("roll").value.trim();
        let age = document.getElementById("age").value.trim();
        let gender = document.getElementById("gender").value;
        let course = document.getElementById("course").value.trim();
        let phone = document.getElementById("phone").value.trim();

        if (
            name === "" ||
            roll === "" ||
            age === "" ||
            gender === "" ||
            course === "" ||
            phone === ""
        ) {

            alert("Please enter all student details! ⚠️");

            return null;
        }

        return {
            name: name,
            roll: roll,
            age: age,
            gender: gender,
            course: course,
            phone: phone
        };
    }


    // Edit Student
    function editStudent(index) {

        let student = students[index];

        document.getElementById("name").value = student.name;
        document.getElementById("roll").value = student.roll;
        document.getElementById("age").value = student.age;
        document.getElementById("gender").value = student.gender;
        document.getElementById("course").value = student.course;
        document.getElementById("phone").value = student.phone;

        editIndex = index;

        document.getElementById("addBtn").style.display = "none";
        document.getElementById("updateBtn").style.display = "inline-block";
        document.getElementById("cancelBtn").style.display = "inline-block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    // Update Student
    function updateStudent() {

        let student = getFormData();

        if (!student) return;

        students[editIndex] = student;

        saveData();

        clearForm();

        displayStudents();

        cancelEdit();

        alert("Student updated successfully! ✅");
    }


    // Delete Student
    function deleteStudent(index) {

        let confirmDelete = confirm(
            "Are you sure you want to delete this student?"
        );

        if (confirmDelete) {

            students.splice(index, 1);

            saveData();

            displayStudents();

            alert("Student deleted successfully! 🗑️");
        }
    }


    // Search Student
    function searchStudent() {

        let searchValue =
            document.getElementById("search").value.toLowerCase();

        let filteredStudents = students.filter(student =>

            student.name.toLowerCase().includes(searchValue) ||

            student.roll.toLowerCase().includes(searchValue) ||

            student.course.toLowerCase().includes(searchValue)

        );

        displayStudents(filteredStudents);
    }


    // Save Data to LocalStorage
    function saveData() {

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );
    }


    // Clear Form
    function clearForm() {

        document.getElementById("name").value = "";
        document.getElementById("roll").value = "";
        document.getElementById("age").value = "";
        document.getElementById("gender").value = "";
        document.getElementById("course").value = "";
        document.getElementById("phone").value = "";
    }


    // Cancel Edit
    function cancelEdit() {

        editIndex = -1;

        clearForm();

        document.getElementById("addBtn").style.display = "inline-block";
        document.getElementById("updateBtn").style.display = "none";
        document.getElementById("cancelBtn").style.display = "none";
    }


    // Load saved data when page opens
    displayStudents();

</script>

</body>
</html>
